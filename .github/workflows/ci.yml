name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: test install from every mirror
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        package-manager: ["pip", "uv"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv (when uv is the manager)
        if: matrix.package-manager == 'uv'
        run: pip install uv

      - name: Install from GitHub Pages PEP 503 index
        run: >
          ${{ matrix.package-manager == 'uv' && 'uv pip install --system' || 'pip install' }}
          openai-agents-nano
          --extra-index-url https://pandeveloper001.github.io/openai-agents-nano-x402/simple/

      - name: Import and smoke-test the installed package
        run: |
          python3 -c "
          from openai_agents_nano import make_nano_x402_tool, NanoX402ToolError
          print(f'make_nano_x402_tool loaded: {make_nano_x402_tool}')
          print(f'NanoX402ToolError loaded: {NanoX402ToolError}')
          "

      - name: Run project test suite (editable install)
        run: |
          pip install -e ".[dev]"
          python3 -m pytest tests/ -q --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Build sdist and wheel
        run: uv build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff
      - name: Run ruff check
        run: ruff check --output-format=github .